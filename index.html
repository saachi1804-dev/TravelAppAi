  @keyframes inUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes chatIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

const byId = {}; G.screens.forEach(s => byId[s.id] = s);
const device = document.getElementById('device');
const history = []; let current = null, timer = null;

G.screens.forEach(s => { new Image().src = s.img; s.fixed.forEach(f => new Image().src = f.img); });

function fit() {
  const k = Math.min(window.innerWidth / 390, window.innerHeight / 844);
  device.style.transform = 'scale(' + k + ')';
  device.style.borderRadius = (window.innerWidth < 500 ? 0 : 36) + 'px';
}
window.addEventListener('resize', fit); fit();

function hotspot(h, parent) {
  const d = document.createElement('div');
  d.className = 'hs';
  Object.assign(d.style, { left: h.x + 'px', top: h.y + 'px', width: h.w + 'px', height: h.h + 'px' });
  d.addEventListener('click', e => { e.stopPropagation(); h.to === 'BACK' ? back() : go(h.to, h.t); });
  parent.appendChild(d);
}

function build(s) {
  const el = document.createElement('div'); el.className = 'screen';
  const sc = document.createElement('div'); sc.className = 'scroller';
  const ct = document.createElement('div'); ct.className = 'content'; ct.style.height = s.h + 'px';
  const img = document.createElement('img'); img.src = s.img; img.alt = s.name; ct.appendChild(img);
  s.hs.filter(h => h.layer < 0).forEach(h => hotspot(h, ct));
  if (s.dots) {
    const d = document.createElement('div'); d.className = 'dots';
    Object.assign(d.style, { left: s.dots.x + 'px', top: s.dots.y + 'px', width: s.dots.w + 'px', height: s.dots.h + 'px' });
    d.innerHTML = '<i></i><i></i><i></i>'; ct.appendChild(d);
  }
  sc.appendChild(ct); el.appendChild(sc);
  s.fixed.forEach(f => {
    const fx = document.createElement('div'); fx.className = 'fixed';
    fx.style.height = f.h + 'px'; fx.style[f.anchor === 'top' ? 'top' : 'bottom'] = '0px';
    const fi = document.createElement('img'); fi.src = f.img; fx.appendChild(fi);
    s.hs.filter(h => h.layer === f.i).forEach(h => hotspot(h, fx));
    el.appendChild(fx);
  });
  el.addEventListener('click', () => { document.body.classList.add('hint'); setTimeout(() => document.body.classList.remove('hint'), 600); });
  return el;
}

function show(id, t, isBack) {
  const s = byId[id]; if (!s) return;
  clearTimeout(timer);
  const el = build(s);
  const type = (t && t.type) || 'INSTANT';
  const dur = Math.round(((t && t.dur) || 0.3) * 1000);
  el.style.setProperty('--d', dur + 'ms');
  let cls = '';
  if (isBack) cls = 'enter-fade';
  else if (type === 'MOVE_IN' && t.dir === 'LEFT') cls = 'enter-left';
  else if (type === 'MOVE_IN' && t.dir === 'TOP') cls = 'enter-up';
  else if (type === 'SMART_ANIMATE') cls = 'enter-chat';
  else if (type === 'DISSOLVE') cls = 'enter-fade';
  const old = device.querySelector('.screen:last-child');
  if (cls) el.classList.add(cls);
  device.appendChild(el);
  if (s.h > 844 && !isBack) el.querySelector('.scroller').scrollTop = 0;
  const cleanup = () => { device.querySelectorAll('.screen').forEach(x => { if (x !== el) x.remove(); }); };
  if (cls) setTimeout(cleanup, dur + 30); else cleanup();
  current = id;
  if (s.timeout) {
    const ms = s.timeout.ms < 100 ? s.timeout.ms * 1000 : s.timeout.ms;
    timer = setTimeout(() => go(s.timeout.to, s.timeout.t, true), ms);
  }
}

function go(id, t, auto) {
  if (current && !(byId[current].typing) && !(byId[current].timeout && auto)) history.push(current);
  show(id, t, false);
}
function back() { const prev = history.pop(); if (prev) show(prev, null, true); }

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { history.length = 0; show(G.start); }
  if (e.key === 'Backspace' || e.key === 'ArrowLeft') back();
});
show(G.start);
