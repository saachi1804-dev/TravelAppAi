<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: Manrope, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #device { position: relative; width: 390px; height: 844px; flex: none; transform-origin: center center; border-radius: 36px; overflow: hidden; background: #EAE6DE; }
  .abs { position: absolute; }
  img { display: block; user-select: none; -webkit-user-drag: none; }
  .screen { position: absolute; inset: 0; z-index: 20; will-change: transform, opacity; }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
  .scroller::-webkit-scrollbar, .msgs::-webkit-scrollbar { display: none; }
  .content { position: relative; width: 390px; }
  .content > img, .fixed > img { width: 100%; height: 100%; pointer-events: none; }
  .fixed { position: absolute; left: 0; width: 390px; z-index: 5; }
  .hs { position: absolute; cursor: pointer; border-radius: 12px; z-index: 6; }
  .hs:active { background: rgba(255,79,22,.10); }
  body.hint .hs.on { background: rgba(255,79,22,.16); outline: 1.5px solid rgba(255,79,22,.55); }

  #chat { position: absolute; inset: 0; display: none; z-index: 10; }
  #chat.on { display: block; animation: fadeIn .35s ease-out both; }
  .msgs { position: absolute; left: 0; right: 0; top: 96px; bottom: 193px; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
  .list { margin-top: auto; padding: 64px 20px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { position: relative; align-self: flex-start; animation: msgIn .28s cubic-bezier(.2,1.3,.35,1) both; transform-origin: bottom left; }
  .msg img { width: 100%; height: 100%; }
  .msg.me { align-self: flex-end; transform-origin: bottom right; }
  .bubble { max-width: 300px; padding: 12px 14px; background: #14121A; color: #fff; font-weight: 600; font-size: 15px; line-height: 1.4; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; word-break: break-word; }
  .msg.leaving { animation: msgOut .28s ease-in both; }
  .typing { width: 70px; height: 38px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: #FF4F16; animation: blink 1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  #ctext { position: absolute; left: 36px; top: 671px; width: 318px; font-size: 15px; line-height: 21px; color: #A39C95; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctext.typed { color: #14121A; white-space: normal; max-height: 63px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #ctext.typed::after { content: ''; display: inline-block; width: 2px; height: 17px; background: #FF4F16; margin-left: 1px; vertical-align: -3px; animation: caret .8s steps(1) infinite; }
  #send { position: absolute; left: 314px; top: 736px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; z-index: 6; }
  #send.wait { animation: pulse 1.6s ease-out infinite; }
  #send.press { transform: scale(.88); transition: transform .12s; background: rgba(255,255,255,.15); }
  #compHit { position: absolute; left: 20px; top: 659px; width: 290px; height: 70px; cursor: text; z-index: 5; }
  #fab, #work { display: none; z-index: 7; cursor: pointer; }
  #fab.on, #work.on { display: block; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
  #work img { border-radius: 24px; }

  .enter-fade { animation: fadeIn var(--d) ease-out both; }
  .enter-left { animation: inLeft var(--d) cubic-bezier(.2,.8,.2,1) both; }
  .enter-up { animation: inUp var(--d) cubic-bezier(.2,.9,.25,1.04) both; }
  .leave { animation: fadeOut .25s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes inLeft { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes inUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes msgIn { 0% { opacity: 0; transform: scale(.82) translateY(8px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes msgOut { to { opacity: 0; transform: translateY(6px) scale(.97); height: 0; margin-top: -8px; } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,79,22,.55); } 70% { box-shadow: 0 0 0 12px rgba(255,79,22,0); } 100% { box-shadow: 0 0 0 0 rgba(255,79,22,0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

  
  
  .loader { width: 350px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.92); color: #14121A; font-size: 13px; }
  .loader h4 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #FFD2BC; border-top-color: #FF4F16; animation: rot .8s linear infinite; box-sizing: border-box; flex: none; }
  .loader .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; color: #8A8A8A; transition: color .3s; }
  .loader .row b { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  .loader .row.doing { color: #14121A; } .loader .row.done { color: #14121A; }
  .loader .row.done b::before { content: '✓'; color: #1E7A46; font-weight: 700; font-size: 13px; animation: pop .3s both; }
  .loader .row.doing b::before { content: ''; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #FFD2BC; border-top-color: #FF4F16; animation: rot .8s linear infinite; }
  .loader .row:not(.doing):not(.done) b::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #D6CEC4; }
  .bar { height: 6px; border-radius: 3px; background: #F1E4DA; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#FF7A3D,#FF4F16); border-radius: 3px; transition: width .9s ease; }
  #workSpin { position: absolute; left: 15px; top: 14px; width: 20px; height: 20px; border-radius: 50%; background: #0B0A0D; }
  #workSpin::after { content: ''; position: absolute; inset: 1px; border-radius: 50%; border: 2.5px solid #FFD2BC; border-top-color: #FF4F16; animation: rot .9s linear infinite; }
  #fab::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: #FF4F16; border-right-color: #FF7A3D; opacity: 0; transition: opacity .2s; }
  #fab.busy::after { opacity: 1; animation: rot .9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .saved { position: absolute; left: 0; top: 40px; width: 162px; justify-content: center; height: 34px; padding: 0 12px; border-radius: 17px; background: #FFEDE3; color: #C43C0B; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; animation: pop .35s cubic-bezier(.2,1.4,.4,1) both; box-sizing: border-box; }
  .note { max-width: 300px; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: rgba(255,255,255,.92); font-size: 14px; font-weight: 500; color: #14121A; line-height: 1.45; }
  .note a { color: #C43C0B; font-weight: 600; text-decoration: none; cursor: pointer; display: inline-block; margin-top: 4px; }
  #sheet { position: absolute; inset: 0; z-index: 30; display: none; }
  #sheet.on { display: block; }
  #sheet .scrim { position: absolute; inset: 0; background: rgba(20,18,26,.35); animation: fadeIn .25s both; }
  #sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 26px 26px 0 0; padding: 10px 18px 28px; animation: inUp .35s cubic-bezier(.2,.9,.25,1.04) both; color: #14121A; }
  #sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #D9D9D9; margin: 0 auto 14px; }
  #sheet h3 { margin: 0; font-size: 20px; font-weight: 600; } #sheet p.sub { margin: 4px 0 14px; color: #6E6862; font-size: 13px; }
  #sheet .item { border: 1px solid #ECE6DF; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 13px; line-height: 1.45; }
  #sheet .item small { display: block; color: #8A8A8A; font-weight: 600; font-size: 10px; letter-spacing: .04em; margin-bottom: 2px; }
  #sheet .item.new { border-color: #FFB896; background: #FFF6F1; animation: pop .4s both; }
  #sheet .tag { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 9px; background: #FFEDE3; color: #C43C0B; font-weight: 600; font-size: 11px; }
  #sheet .x { position: absolute; right: 16px; top: 18px; width: 28px; height: 28px; border-radius: 50%; background: #F1EEEA; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

  #addPerson { position: absolute; left: 234px; top: 52px; width: 40px; height: 40px; border-radius: 50%; background: #FDFDFD; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6; }
  #menu { position: absolute; left: 108px; top: 96px; width: 262px; z-index: 26; background: #fff; border-radius: 18px; padding: 6px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(20,18,26,.16); display: none; transform-origin: top right; }
  #menu.on { display: block; animation: menuIn .2s cubic-bezier(.2,1.2,.4,1) both; }
  #menuScrim { position: absolute; inset: 0; z-index: 25; display: none; }
  #menuScrim.on { display: block; }
  #menu .mi { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 500; color: #14121A; cursor: pointer; }
  #menu .mi:active { background: #F5F2EE; }
  #menu .mi span { flex: 1; } #menu .mi em { font-style: normal; font-size: 12px; color: #8A8A8A; }
  #menu .mi svg { width: 20px; height: 20px; flex: none; }
  #menu .div { height: 1px; background: #EFEAE4; margin: 0 6px; }
  #menu .mi.red { color: #D92D20; }
  #toast { position: absolute; left: 50%; bottom: 200px; transform: translateX(-50%); background: #14121A; color: #fff; font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 18px; z-index: 40; white-space: nowrap; display: none; }
  #toast.on { display: block; animation: pop .3s both; }
  @keyframes menuIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
</style>

let remembered = false;
async function remember(chips) {
  if (remembered || busy) return; remembered = true;
  const s = document.createElement('div'); s.className = 'saved';
  s.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#C43C0B"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Saved';
  chips.appendChild(s);
  await typingDots(700);
  const n = document.createElement('div'); n.className = 'msg reveal';
  n.innerHTML = '<div class="note">Saved. I’ll remind you before booking, so you can decide on the airport pickups later.<br><a>See what I remember ›</a></div>';
  n.querySelector('a').addEventListener('click', e => { e.stopPropagation(); openMem(); });
  addEl(n);
}
function openMem() {
  const items = [
    ['FAMILY', '6 travellers: you, Neha, Riya (4), Aarav (9), Mummy and Papa'],
    ['PAPA’S NEEDS', 'Less walking, ground floor or lift, wheelchair at airports'],
    ['TRIP', '21 Dec – 5 Jan · San Jose, Seattle, New York · from Vadodara']
  ];
  let h = items.map(i => '<div class="item"><small>' + i[0] + '</small>' + i[1] + '</div>').join('');
  if (remembered) h = '<div class="item new"><small>SAVED JUST NOW</small>Airport pickups: Ishaan picks you up, or book a rental<br><span class="tag">I’ll remind you before booking</span></div>' + h;
  document.getElementById('mem').innerHTML = h;
  document.getElementById('sheet').classList.add('on');
}
document.querySelector('#sheet .x').addEventListener('click', () => document.getElementById('sheet').classList.remove('on'));
document.querySelector('#sheet .scrim').addEventListener('click', () => document.getElementById('sheet').classList.remove('on'));

function composerTap() {
  if (!inChat || busy) return;
  const n = composerNext[cur]; if (n) go(n, null, { fromComposer: true });
}
document.getElementById('compHit').addEventListener('click', composerTap);
send.addEventListener('click', composerTap);
document.getElementById('fab').addEventListener('click', () => { if (!busy) go('907:116', { type: 'MOVE_IN', dir: 'LEFT', dur: .35 }, {}); });
document.getElementById('work').addEventListener('click', () => go('880:116', { type: 'DISSOLVE', dur: .25 }, {}));
const menu = document.getElementById('menu'), mscrim = document.getElementById('menuScrim'), toastEl = document.getElementById('toast');
function toast(s) { toastEl.textContent = s; toastEl.classList.remove('on'); void toastEl.offsetWidth; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1800); }
function closeMenu() { menu.classList.remove('on'); mscrim.classList.remove('on'); }
document.getElementById('more').addEventListener('click', e => { e.stopPropagation(); menu.classList.add('on'); mscrim.classList.add('on'); });
mscrim.addEventListener('click', e => { e.stopPropagation(); closeMenu(); });
menu.querySelectorAll('.mi').forEach(m => m.addEventListener('click', e => {
  e.stopPropagation(); closeMenu(); const k = m.dataset.k;
  if (k === 'mem') openMem();
  else if (k === 'family') go('866:176', { type: 'MOVE_IN', dir: 'TOP', dur: .35 }, {});
  else if (k === 'save') toast('Chat saved. Find it in My trips.');
  else if (k === 'agent') toast('Connecting you to a Cleartrip agent…');
  else if (k === 'lang') toast('Choose English, हिंदी, ગુજરાતી or தமிழ்');
  else if (k === 'size') toast('Text size: Default');
  else if (k === 'del') toast('Delete needs your confirmation first');
}));
document.getElementById('addPerson').addEventListener('click', e => { e.stopPropagation(); toast('Invite Neha, Ishaan or Meera to plan with you'); });

device.addEventListener('click', e => {
  if (e.target.closest('.hs') || e.target.id === 'send' || e.target.id === 'compHit') return;
  document.body.classList.add('hint'); setTimeout(() => document.body.classList.remove('hint'), 650);
});
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') location.reload();
  if (e.key === 'Escape' || e.key === 'ArrowLeft') back();
});
ctext.textContent = placeholderFor('');
showPre(G.start);
</script>
</body>
</html>
